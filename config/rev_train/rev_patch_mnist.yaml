# ------------------------------------------------------------
# Experiment paths
# ------------------------------------------------------------
base_path: record/20260629_182416_badnet_attack_badnet_6MrG

model_name: final_state_dict.pth
save_model_name: mnist_patch_low_asr_model.pth
log_name: reverse_patch.log

# ------------------------------------------------------------
# Dataset
# ------------------------------------------------------------
dataset: mnist
dataset_path: data

# ------------------------------------------------------------
# Trigger
# ------------------------------------------------------------
trigger_path: resource/badnet/trigger_image.png

# ------------------------------------------------------------
# Model
# ------------------------------------------------------------
model: simplecnn
num_classes: 10

# ------------------------------------------------------------
# Image
# ------------------------------------------------------------
input_height: 28
input_width: 28
mean: 0.5
std: 0.5
random_crop_padding: 4

# ------------------------------------------------------------
# Training
# ------------------------------------------------------------
batch_size: 128
num_workers: 4

epochs: 60
lr: 1.0e-6
momentum: 0.9
weight_decay: 5.0e-4

reverse_ratio: 0.05
reverse_steps_per_epoch: 50

# ------------------------------------------------------------
# Evaluation
# ------------------------------------------------------------
target_label: 0
desired_asr: 0.12

# ------------------------------------------------------------
# Misc
# ------------------------------------------------------------
device: cuda
visualize: true
visualize_index: 0
