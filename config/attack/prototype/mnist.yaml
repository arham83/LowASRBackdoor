num_workers: 4
pin_memory: True
non_blocking: True
prefetch: False
amp: False
device: cuda:0
random_seed: 0
frequency_save: 0
dataset: mnist
dataset_path: ./data
num_classes: 10
input_height: 28
input_width: 28
input_channel: 1
img_size: [28, 28]
batch_size: 128
epochs: 20
lr: 0.01
lr_scheduler: MultiStepLR
steplr_milestones: [20, 25]
steplr_gamma: 0.1
client_optimizer: sgd
sgd_momentum: 0.9
wd: 0.0005

model: simplecnn
